name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        node-version: [ 20.x ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Clang (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Install Dependencies
        run: npm ci

      - name: Build Workspaces
        run: npm run build

      - name: Run Test Suite (6,900+ Tests)
        run: npm test

      - name: Validate Reviewed Dataset (21,500+ Cases)
        run: python tools/validate_dataset.py

      - name: Run Strict Benchmark Gate
        run: node tools/benchmark_dataset.mjs --manifest=cpp-micro-statements.manifest.json --strict
